# 8 threads: measured over all eight databases, the whole series takes 56:08
# at 8, 67:09 at 4, 81:27 at 2 and 95:55 at 1. Failure counts agree at 1, 2
# and 8. One thread is the reference for judging a failure, not for running
# the suite - without concurrency, whatever still fails is real.
#
# Classes and methods both run concurrently. A class that rebuilds its own
# tables in setup opts out with @Execution(SAME_THREAD) - see
# ExplicitRecognizerTest - or its methods query a table a sibling is
# recreating.
#
#   mvn test -Djunit.jupiter.execution.parallel.enabled=false
#
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 8
